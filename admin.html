<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — ArenaLives</title>
<style>
  :root[data-theme="dark"] { --bg: #080808; --bg-glass: rgba(20, 20, 20, 0.6); --bg-glass-hover: rgba(30, 30, 30, 0.8); --text: #f1efe9; --muted: #9f9b91; --gold: #d9bd78; --gold-soft: rgba(217, 189, 120, 0.15); --green: #22c55e; --green-soft: rgba(34, 197, 94, 0.15); --red: #ef4444; --red-soft: rgba(239, 68, 68, 0.15); --yellow: #f59e0b; --yellow-soft: rgba(245, 158, 11, 0.15); --border: rgba(255, 255, 255, 0.08); }
  :root[data-theme="light"] { --bg: #f4f6f8; --bg-glass: rgba(255, 255, 255, 0.7); --bg-glass-hover: rgba(255, 255, 255, 0.9); --text: #111827; --muted: #6b7280; --gold: #b89b5e; --gold-soft: rgba(184, 155, 94, 0.1); --green: #16a34a; --green-soft: rgba(22, 163, 74, 0.1); --red: #dc2626; --red-soft: rgba(220, 38, 38, 0.1); --yellow: #d97706; --yellow-soft: rgba(217, 119, 6, 0.1); --border: rgba(0, 0, 0, 0.06); }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
  .sidebar { width: 260px; padding: 30px 20px; display: flex; flex-direction: column; gap: 30px; background: var(--bg-glass); border-right: 1px solid var(--border); height: 100vh; position: sticky; top: 0; }
  .brand { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .brand span { color: var(--gold); }
  .nav { display: flex; flex-direction: column; gap: 6px; }
  .nav-item { padding: 12px 16px; border-radius: 12px; color: var(--muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .nav-item.active { background: var(--gold-soft); color: var(--gold); border-color: rgba(217, 189, 120, 0.3); }
  .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .btn-side { padding: 12px; border-radius: 12px; background: var(--bg-glass-hover); text-align: center; font-weight: 600; border: 1px solid var(--border); color: var(--text); cursor: pointer; }
  .main { flex: 1; padding: 40px; }
  .header { display: flex; justify-content: space-between; margin-bottom: 30px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: var(--bg-glass); border: 1px solid var(--border); padding: 24px; border-radius: 20px; }
  .stat-value { font-size: 2rem; font-weight: 800; }
  .stat-value.green { color: var(--green); }
  .stat-value.gold { color: var(--gold); }
  .table-container { background: var(--bg-glass); border: 1px solid var(--border); border-radius: 20px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; min-width: 950px; }
  th { padding: 16px 20px; font-size: 0.75rem; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
  td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
  .badge.paid { background: var(--green-soft); color: var(--green); }
  .badge.pending { background: var(--yellow-soft); color: var(--yellow); }
  .login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .login-box { background: var(--bg-glass); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; }
  .login-box input { width: 100%; padding: 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); margin-bottom: 16px; }
</style>
</head>
<body>

<div class="login-overlay" id="loginScreen">
  <div class="login-box">
    <h2 style="color: var(--gold); margin-bottom: 20px;">ARENA <span style="color: var(--text)">ADMIN</span></h2>
    <input type="password" id="adminPass" placeholder="Senha de acesso" onkeypress="if(event.key==='Enter') fazerLogin()">
    <button class="btn-side" style="width: 100%; background: var(--gold); color: #000; border: none;" onclick="fazerLogin()" id="btnLogin">Acessar</button>
  </div>
</div>

<div id="dashboard" style="display: none; width: 100%;">
  <aside class="sidebar">
    <div class="brand">ARENA <span>ADMIN</span></div>
    <div class="nav">
      <div class="nav-item active">📦 Todas as Vendas</div>
    </div>
    <div class="sidebar-bottom">
      <div class="btn-side" onclick="carregarDados()">🔄 Atualizar Lista</div>
      <div class="btn-side" onclick="sair()" style="color: var(--red);">🚪 Sair</div>
    </div>
  </aside>

  <main class="main">
    <div class="header"><h1>Painel de Vendas (ZPay)</h1></div>
    <div class="stats-grid">
      <div class="stat-card"><div style="font-size: 0.85rem; color: var(--muted);">Total Recebido</div><div class="stat-value green" id="statFaturamento">R$ 0,00</div></div>
      <div class="stat-card"><div style="font-size: 0.85rem; color: var(--muted);">Vendas Aprovadas</div><div class="stat-value" id="statPagos">0</div></div>
      <div class="stat-card"><div style="font-size: 0.85rem; color: var(--muted);">Pendentes</div><div class="stat-value gold" id="statPendentes">0</div></div>
    </div>
    <div class="table-container">
      <table>
        <thead><tr><th>ID</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody id="tabelaCorpo"><tr><td colspan="3" style="text-align: center; color: var(--muted); padding: 30px;">Carregando dados da ZPay...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  async function fazerLogin() {
    const pass = document.getElementById('adminPass').value;
    const btn = document.getElementById('btnLogin');
    if(!pass) return;
    btn.disabled = true; btn.textContent = 'Verificando...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('arena_admin_logado', '1');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        carregarDados();
      } else {
        alert('Senha incorreta!');
        btn.disabled = false; btn.textContent = 'Acessar';
      }
    } catch (e) { alert('Erro de conexão.'); }
  }

  function sair() { sessionStorage.removeItem('arena_admin_logado'); location.reload(); }

  async function carregarDados() {
    document.getElementById('tabelaCorpo').innerHTML = '<tr><td colspan="3" style="text-align: center; padding: 30px;">Buscando pagamentos...</td></tr>';
    try {
      const res = await fetch('/api/list-payments');
      const json = await res.json();
      
      if (!json.success) throw new Error('Falha ao carregar');
      
      const pagamentos = json.data;
      let faturamento = 0, pagos = 0, pendentes = 0;

      const tbody = document.getElementById('tabelaCorpo');
      if (pagamentos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; padding: 30px;">Nenhum pagamento encontrado.</td></tr>';
        return;
      }

      tbody.innerHTML = pagamentos.map(p => {
        const isPaid = ['paid', 'approved', 'completed'].includes(p.status.toLowerCase());
        if (isPaid) { faturamento += (p.amount || 0); pagos++; }
        else if (p.status === 'pending') { pendentes++; }
        
        return `
          <tr>
            <td style="font-family: monospace; font-size: 0.8rem;">${p.id || p.paymentId}</td>
            <td style="font-weight: bold; color: var(--green);">R$ ${(p.amount || 0).toFixed(2).replace('.', ',')}</td>
            <td><span class="badge ${isPaid ? 'paid' : 'pending'}">${p.status}</span></td>
          </tr>
        `;
      }).join('');

      document.getElementById('statFaturamento').textContent = 'R$ ' + faturamento.toFixed(2).replace('.', ',');
      document.getElementById('statPagos').textContent = pagos;
      document.getElementById('statPendentes').textContent = pendentes;

    } catch (e) {
      document.getElementById('tabelaCorpo').innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--red); padding: 30px;">Erro ao carregar dados da ZPay.</td></tr>';
    }
  }

  if (sessionStorage.getItem('arena_admin_logado') === '1') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    carregarDados();
  }
</script>
</body>
</html>
