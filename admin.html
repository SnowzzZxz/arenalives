<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — ArenaLives</title>
<style>
  :root[data-theme="dark"] {
    --bg: #080808; --bg-glass: rgba(20, 20, 20, 0.6); --bg-glass-hover: rgba(30, 30, 30, 0.8);
    --text: #f1efe9; --muted: #9f9b91; --gold: #d9bd78; --gold-soft: rgba(217, 189, 120, 0.15);
    --green: #22c55e; --green-soft: rgba(34, 197, 94, 0.15);
    --red: #ef4444; --red-soft: rgba(239, 68, 68, 0.15);
    --yellow: #f59e0b; --yellow-soft: rgba(245, 158, 11, 0.15);
    --border: rgba(255, 255, 255, 0.08);
  }
  :root[data-theme="light"] {
    --bg: #f4f6f8; --bg-glass: rgba(255, 255, 255, 0.7); --bg-glass-hover: rgba(255, 255, 255, 0.9);
    --text: #111827; --muted: #6b7280; --gold: #b89b5e; --gold-soft: rgba(184, 155, 94, 0.1);
    --green: #16a34a; --green-soft: rgba(22, 163, 74, 0.1);
    --red: #dc2626; --red-soft: rgba(220, 38, 38, 0.1);
    --yellow: #d97706; --yellow-soft: rgba(217, 119, 6, 0.1);
    --border: rgba(0, 0, 0, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; display: flex; }
  body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 15% 50%, var(--gold-soft), transparent 40%), radial-gradient(circle at 85% 30%, var(--green-soft), transparent 40%); opacity: 0.8; transition: 0.3s; }

  .sidebar { width: 260px; padding: 30px 20px; display: flex; flex-direction: column; gap: 30px; background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-right: 1px solid var(--border); height: 100vh; position: sticky; top: 0; }
  .brand { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.05em; display: flex; align-items: center; gap: 10px; }
  .brand span { color: var(--gold); }
  .nav { display: flex; flex-direction: column; gap: 6px; }
  .nav-item { padding: 12px 16px; border-radius: 12px; color: var(--muted); font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; border: 1px solid transparent; }
  .nav-item:hover { background: var(--bg-glass-hover); color: var(--text); }
  .nav-item.active { background: var(--gold-soft); color: var(--gold); border-color: rgba(217, 189, 120, 0.3); }
  .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .btn-side { padding: 12px; border-radius: 12px; background: var(--bg-glass-hover); cursor: pointer; text-align: center; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--border); transition: 0.2s; color: var(--text); display: flex; justify-content: center; align-items: center; gap: 8px; }
  .btn-side:hover { background: var(--border); }
  .btn-side.danger { color: var(--red); border-color: var(--red-soft); }
  .btn-side.danger:hover { background: var(--red-soft); }

  .main { flex: 1; padding: 40px; max-width: 1400px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;}
  .header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.05em; }
  
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border); padding: 24px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.05); transition: transform 0.2s; }
  .stat-card:hover { transform: translateY(-4px); }
  .stat-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 2rem; font-weight: 800; letter-spacing: -0.05em; }
  .stat-value.green { color: var(--green); }
  .stat-value.gold { color: var(--gold); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
  .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
  .tab { padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; background: var(--bg-glass); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; transition: 0.2s; }
  .tab:hover { background: var(--bg-glass-hover); }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tab.active.green { background: var(--green); color: #fff; border-color: var(--green); }
  .tab.active.red { background: var(--red); color: #fff; border-color: var(--red); }

  .search-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search-box input, .search-box select { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-glass); color: var(--text); font-size: 0.9rem; outline: none; }
  .search-box input { width: 250px; }
  .search-box input:focus, .search-box select:focus { border-color: var(--gold); }

  .table-container { background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.05); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; min-width: 950px; }
  th { padding: 16px 20px; font-size: 0.75rem; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 700; letter-spacing: 0.05em; background: rgba(0,0,0,0.02); }
  td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; font-weight: 500; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-glass-hover); }
  
  .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; display: inline-block; }
  .badge.pendente { background: var(--yellow-soft); color: var(--yellow); }
  .badge.pago { background: var(--green-soft); color: var(--green); }
  .badge.cancelado { background: var(--red-soft); color: var(--red); }

  .btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-glass); color: var(--text); font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;}
  .btn:hover { background: var(--bg-glass-hover); }

  .login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .login-box { background: var(--bg-glass); backdrop-filter: blur(20px); padding: 40px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
  .login-box h2 { margin-bottom: 24px; font-size: 1.5rem; font-weight: 800; }
  .login-box input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; margin-bottom: 16px; outline: none; transition: 0.2s; }
  .login-box input:focus { border-color: var(--gold); }
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="login-overlay" id="loginScreen">
  <div class="login-box">
    <h2 style="color: var(--gold);">ARENA <span style="color: var(--text)">ADMIN</span></h2>
    <input type="password" id="adminPass" placeholder="Digite a senha de acesso" onkeypress="if(event.key==='Enter') fazerLogin()">
    <button class="btn primary" style="width: 100%; padding: 14px; font-size: 1rem; justify-content: center; background: var(--gold); color: #000; border: none; border-radius: 12px; cursor: pointer;" onclick="fazerLogin()" id="btnLogin">Acessar Painel</button>
    <p id="loginError" style="color: var(--red); font-size: 0.85rem; margin-top: 12px; display: none;">Senha incorreta!</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display: none; width: 100%;">
  <aside class="sidebar">
    <div class="brand">ARENA <span>ADMIN</span></div>
    
    <div class="nav">
      <div class="nav-item active" onclick="mudarAba('todos')">📦 Todas as Vendas</div>
      <div class="nav-item" onclick="mudarAba('pendente')">⏳ Pendentes</div>
      <div class="nav-item" onclick="mudarAba('pago')">✅ Pagas</div>
    </div>

    <div class="sidebar-bottom">
      <div class="btn-side" onclick="carregarDados()">🔄 Atualizar Lista</div>
      <div class="btn-side" onclick="toggleTheme()" id="themeBtn">🌙 Modo Escuro</div>
      <div class="btn-side danger" onclick="sair()" style="color: var(--red);">🚪 Sair</div>
    </div>
  </aside>

  <main class="main">
    <div class="header">
      <h1>Painel de Vendas</h1>
      <span style="font-size: 0.8rem; color: var(--muted);">Dados reais da ZPay</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Faturamento Total</div>
        <div class="stat-value green" id="statFaturamento">R$ 0,00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Vendas Aprovadas</div>
        <div class="stat-value" id="statPagos">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pendentes</div>
        <div class="stat-value gold" id="statPendentes">0</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="tabs">
        <div class="tab active" id="tab-todos" onclick="mudarAba('todos')">Todos</div>
        <div class="tab" id="tab-pendente" onclick="mudarAba('pendente')">Pendentes</div>
        <div class="tab green" id="tab-pago" onclick="mudarAba('pago')">Pagos</div>
      </div>
      <div class="search-box">
        <input type="text" id="filtroBusca" placeholder="Buscar por ID..." oninput="renderTabela()">
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Data / ID do PIX</th>
            <th>Valor</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  let pagamentos = [];
  let filtroAtual = 'todos';

  async function fazerLogin() {
    const pass = document.getElementById('adminPass').value;
    const btn = document.getElementById('btnLogin');
    const error = document.getElementById('loginError');

    if(!pass) return;
    btn.disabled = true; btn.textContent = 'Verificando...';
    error.style.display = 'none';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const data = await res.json();

      if (data.success) {
        sessionStorage.setItem('arena_admin_logado', '1');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        carregarDados();
      } else {
        error.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Acessar Painel';
      }
    } catch (e) {
      alert('Erro de conexão com o servidor.');
      btn.disabled = false; btn.textContent = 'Acessar Painel';
    }
  }

  function sair() {
    sessionStorage.removeItem('arena_admin_logado');
    location.reload();
  }

  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
  }

  // ==========================================
  // AQUI ELE BUSCA OS DADOS DA API DA ZPAY
  // ==========================================
  async function carregarDados() {
    document.getElementById('tabelaCorpo').innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 40px; color: var(--muted);">Buscando dados da ZPay...</td></tr>';
    
    try {
      const res = await fetch('/api/list-payments');
      const json = await res.json();
      
      if (!json.success) throw new Error('Falha ao carregar');

      // A ZPay retorna uma lista, vamos padronizar
      pagamentos = json.data.map(p => {
        const isPaid = ['paid', 'approved', 'completed'].includes(String(p.status).toLowerCase());
        return {
          id: p.id || p.paymentId,
          data: p.createdAt || p.created_at || new Date().toISOString(),
          valor: p.amount || 0,
          status: isPaid ? 'pago' : (p.status === 'pending' ? 'pendente' : 'cancelado')
        };
      });

      atualizarStats();
      renderTabela();

    } catch (e) {
      document.getElementById('tabelaCorpo').innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--red); padding: 40px;">Erro ao carregar os dados da ZPay.</td></tr>';
    }
  }

  function atualizarStats() {
    const pagos = pagamentos.filter(p => p.status === 'pago');
    const pendentes = pagamentos.filter(p => p.status === 'pendente');
    const faturamento = pagos.reduce((acc, p) => acc + p.valor, 0);

    document.getElementById('statFaturamento').textContent = 'R$ ' + faturamento.toFixed(2).replace('.', ',');
    document.getElementById('statPagos').textContent = pagos.length;
    document.getElementById('statPendentes').textContent = pendentes.length;
  }

  function mudarAba(status) {
    filtroAtual = status;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + status).classList.add('active');
    
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const index = ['todos', 'pendente', 'pago'].indexOf(status);
    if (document.querySelectorAll('.nav-item')[index]) {
      document.querySelectorAll('.nav-item')[index].classList.add('active');
    }
    renderTabela();
  }

  function renderTabela() {
    const tbody = document.getElementById('tabelaCorpo');
    const busca = document.getElementById('filtroBusca').value.toLowerCase().trim();

    let filtrados = filtroAtual === 'todos' ? [...pagamentos] : pagamentos.filter(p => p.status === filtroAtual);

    if (busca) {
      filtrados = filtrados.filter(p => p.id.toLowerCase().includes(busca));
    }

    filtrados.sort((a, b) => new Date(b.data) - new Date(a.data));

    if (filtrados.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 40px; color: var(--muted);">Nenhuma venda encontrada com esses filtros.</td></tr>';
      return;
    }

    tbody.innerHTML = filtrados.map(p => {
      const dataFormatada = new Date(p.data).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
      
      return `
        <tr>
          <td>
            <div style="font-size: 0.8rem; color: var(--muted);">${dataFormatada}</div>
            <div style="font-family: monospace; font-size: 0.75rem; word-break: break-all;">${p.id}</div>
          </td>
          <td style="font-weight: 700; color: var(--green);">R$ ${p.valor.toFixed(2).replace('.', ',')}</td>
          <td><span class="badge ${p.status}">${p.status}</span></td>
        </tr>
      `;
    }).join('');
  }

  if (sessionStorage.getItem('arena_admin_logado') === '1') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    carregarDados();
  }
</script>
</body>
</html>
