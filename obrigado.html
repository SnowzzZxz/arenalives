<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado! - ArenaLives</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #080808; color: #f1efe9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 20px; }
  .container { max-width: 500px; padding: 40px; background: #111; border-radius: 16px; border: 1px solid #222; }
  .icon { font-size: 60px; margin-bottom: 20px; }
  h1 { color: #15c36b; font-size: 1.8rem; margin-bottom: 15px; }
  p { color: #9f9b91; font-size: 1rem; line-height: 1.6; margin-bottom: 30px; }
  .btn { display: inline-block; background: #15c36b; color: #fff; text-decoration: none; padding: 15px 30px; border-radius: 25px; font-weight: 800; text-transform: uppercase; font-size: 0.9rem; transition: 0.2s; }
  .btn:hover { opacity: 0.9; transform: translateY(-2px); }
</style>
</head>
<body>
<div class="container">
  <div class="icon">🎉</div>
  <h1>Pagamento Aprovado!</h1>
  <p>Obrigado pela sua compra. O acesso ao seu produto já está liberado abaixo. Se tiver qualquer problema, entre em contato com o nosso suporte.</p>
  <a href="https://drive.google.com/SEU_LINK_AQUI" target="_blank" class="btn">Acessar Produto</a>
</div>
</body>
</html>
